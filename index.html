<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>បញ្ជីបំណុល</title><link rel="stylesheet" href="style.css"></head><body><header><b>🏪 បញ្ជីបំណុល</b><button id="theme">☀️</button><small>គ្រប់គ្រងបំណុលបានងាយស្រួល</small></header><main><section class="stats"><div>💰 បំណុលសរុប<strong id="total">0 ៛</strong></div><div>👥 អ្នកជំពាក់<strong id="people">0</strong></div><div>✅ បានបង់<strong id="paid">0 ៛</strong></div></section><section class="tools"><input id="search" placeholder="🔎 ស្វែងរកឈ្មោះ..."><button id="add">＋ បន្ថែមបំណុល</button></section><nav><button class="active" data-f="all">ទាំងអស់</button><button data-f="unpaid">មិនទាន់បង់</button><button data-f="paid">បានបង់</button></nav><div id="list"></div></main><div id="modal" class="modal hide"><form id="form"><button type="button" id="close">×</button><h2 id="title">បន្ថែមបំណុល</h2><input id="name" required placeholder="ឈ្មោះ"><input id="phone" placeholder="លេខទូរស័ព្ទ"><input id="amount" required type="number" min="0" placeholder="ចំនួនទឹកប្រាក់ (៛)"><textarea id="note" placeholder="ចំណាំ"></textarea><label><input id="ispaid" type="checkbox"> បានបង់រួច</label><button>រក្សាទុក</button></form></div><script src="script.js"></script></body></html>
